diagnostyka_ocen:
  name: Diagnostyka ocen
  description: >
    Pobiera stronę ocen i zapisuje raport (liczba ocen, surowy HTML kilku pierwszych) do pliku
    librus_apix_diagnostyka_ocen.txt w katalogu konfiguracji HA. Przydatne, gdy oceny się nie pojawiają.
  fields:
    config_entry_id:
      name: Wpis integracji
      required: false
      selector:
        text:

dodaj_lekcje_dodatkowa:
  name: Dodaj lekcję dodatkową
  description: Dopisuje do planu zajęcia, których nie ma w planie Librusa. Trafiają do wszystkich czujników planu, kalendarza i czasu końca ostatniej lekcji.
  fields:
    przedmiot:
      name: Nazwa zajęć
      required: true
      example: Angielski
      selector:
        text:
    od:
      name: Od godziny
      required: true
      example: "16:00"
      selector:
        time:
    do:
      name: Do godziny
      required: true
      example: "17:00"
      selector:
        time:
    powtarzanie:
      name: Powtarzanie
      required: false
      default: co_tydzien
      selector:
        select:
          options:
            - co_tydzien
            - co_2_tygodnie
            - jednorazowo
    dzien:
      name: Dzień tygodnia (dla zajęć cotygodniowych)
      required: false
      example: środa
      selector:
        select:
          options:
            - poniedziałek
            - wtorek
            - środa
            - czwartek
            - piątek
            - sobota
            - niedziela
    data:
      name: Data (dla zajęć jednorazowych albo pierwszych zajęć co 2 tygodnie)
      required: false
      selector:
        date:
    miejsce:
      name: Miejsce lub prowadzący
      required: false
      example: Szkoła językowa, sala 3
      selector:
        text:
    config_entry_id:
      name: Wpis integracji
      required: false
      selector:
        text:

edytuj_lekcje_dodatkowa:
  name: Edytuj lekcję dodatkową
  description: Zmienia wybrane pola zajęć dodatkowych (pominięte pola zostają bez zmian). Odwołane terminy, które nadal pasują do nowego terminu, zostają odwołane.
  fields:
    id:
      name: Identyfikator zajęć
      description: Z atrybutu "lekcje" czujnika "Lekcje dodatkowe".
      required: true
      selector:
        text:
    przedmiot:
      name: Nazwa zajęć
      required: false
      selector:
        text:
    od:
      name: Od godziny
      required: false
      selector:
        time:
    do:
      name: Do godziny
      required: false
      selector:
        time:
    powtarzanie:
      name: Powtarzanie
      required: false
      selector:
        select:
          options:
            - co_tydzien
            - co_2_tygodnie
            - jednorazowo
    dzien:
      name: Dzień tygodnia (dla zajęć cotygodniowych)
      required: false
      selector:
        select:
          options:
            - poniedziałek
            - wtorek
            - środa
            - czwartek
            - piątek
            - sobota
            - niedziela
    data:
      name: Data (dla zajęć jednorazowych albo pierwszych zajęć co 2 tygodnie)
      required: false
      selector:
        date:
    miejsce:
      name: Miejsce lub prowadzący
      required: false
      selector:
        text:
    config_entry_id:
      name: Wpis integracji
      required: false
      selector:
        text:

odwolaj_termin_lekcji_dodatkowej:
  name: Odwołaj termin zajęć dodatkowych
  description: Odwołuje zajęcia dodatkowe tylko w jednym dniu. W planie zostają jako odwołane (nie liczą się do końca lekcji), a kolejne tygodnie bez zmian.
  fields:
