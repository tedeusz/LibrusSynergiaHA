    Przesuwa widok planu o tydzień (do 12 tygodni wstecz i w przód). Tygodnie spoza danych bazowych
    są pobierane z Librusa na żądanie.
  fields:
    kierunek:
      name: Kierunek
      required: true
      example: nastepny
      selector:
        select:
          options:
            - nastepny
            - poprzedni
            - biezacy
    config_entry_id:
      name: Wpis integracji
      required: false
      selector:
        text:

