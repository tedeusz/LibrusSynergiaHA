              data:
                indeks: 4
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Nowsze
                icon: mdi:chevron-left
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj
                  data:
                    kierunek: poprzednia
              - type: custom:mushroom-template-card
                primary: Najnowsze
                icon: mdi:page-first
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj
                  data:
                    kierunek: najnowsze
              - type: custom:mushroom-template-card
                primary: Starsze
                icon: mdi:chevron-right
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj
                  data:
                    kierunek: nastepna
          - type: markdown
            title: 📖 Treść wiadomości
            content: |
              {%- set o = state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'otwarta') or {} -%}
              {%- if o.temat -%}
              ### {{ o.temat }}
              _{{ o.nadawca }} · {{ o.data }}{{ ' · 📎 załącznik' if o.ma_zalacznik else '' }}_

              {{ o.tresc | replace('\n', '  \n') }}
              {%- else -%}
              _Kliknij wiadomość na liście powyżej, aby pobrać i zobaczyć jej treść. Strzałkami przejdziesz do starszych._
              _(Uwaga: otwarcie oznacza wiadomość w Librusie jako przeczytaną.)_
              {%- endif -%}
  # Druga zakładka: wiadomości wysłane (lista po 5 z paginacją; kliknięcie pokazuje treść na dole; "Najnowsze" odświeża listę z Librusa)
