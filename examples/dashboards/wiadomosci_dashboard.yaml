views:
  - title: Wiadomości
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 📬 Wiadomości Librus
            subtitle: >
              {% set n = state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'liczba_nieprzeczytanych') %}
              {% set p = (state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'przegladanie') or {}) %}
              {% if n > 0 %}{{ n }} nieprzeczytanych{% else %}Wszystkie przeczytane{% endif %}
              · {% if p.najnowsze %}najnowsze{% else %}strona {{ p.strona }}, pozycje {{ p.od }}–{{ p.do }}{% endif %}
            tap_action:
              action: url
              url_path: https://portal.librus.pl/rodzina/synergia/loguj
          - type: custom:mushroom-template-card
            primary: >
              {% set m = ((state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'przegladanie') or {}).wiadomosci or [])[0] | default({}) %}{{ m.temat | default('— brak —') }}
            secondary: >
              {% set m = ((state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'przegladanie') or {}).wiadomosci or [])[0] | default({}) %}{{ m.nadawca | default('') }}{% if m.data %} · {{ m.data }}{% endif %}
            icon: mdi:message-text
            icon_color: >
              {% set m = ((state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'przegladanie') or {}).wiadomosci or [])[0] | default({}) %}{% if m.nieprzeczytana or m.jest_nowa %}red{% else %}grey{% endif %}
            badge_icon: >
              {% set m = ((state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'przegladanie') or {}).wiadomosci or [])[0] | default({}) %}{% if m.ma_zalacznik %}mdi:paperclip{% endif %}
            tap_action:
              action: perform-action
              perform_action: librus_apix.pobierz_tresc
              data:
                indeks: 0
          - type: custom:mushroom-template-card
            primary: >
              {% set m = ((state_attr('sensor.librus_imie_nazwisko_wiadomosci', 'przegladanie') or {}).wiadomosci or [])[1] | default({}) %}{{ m.temat | default('— brak —') }}
