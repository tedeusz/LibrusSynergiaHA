# Dashboard "Plan lekcji" dla integracji Librus APIX
# Wklej: Ustawienia > Pulpity > (pulpit) > Edytuj > ⋮ > Edytor YAML (Raw configuration editor)
# Wymaga czujnikow sensor.librus_imie_nazwisko_aktualna_lekcja i ..._tematy_lekcji (nowa wersja integracji).
# Druga zakladka ("Zajęcia dodatkowe") to formularz do recznego dopisywania zajec, ktorych nie ma w planie Librusa
# (encje text/select/time/date/button.librus_imie_nazwisko_lekcja_dodatkowa_*). Dodane zajecia sa scalane z planem Librusa
# we wszystkich czujnikach planu i w kalendarzu (oznaczone ➕), wiec np. "koniec ostatniej lekcji" je uwzglednia.
# Pojedynczy termin zajec odwolasz na dole zakladki z planem (zostaje w planie jako ❌ odwolane), a istniejace zajecia
# edytujesz w drugiej zakladce (wybierz je na liscie "Edytuj istniejace", zmien pola i "Zapisz zmiany").
# Przy zrealizowanych lekcjach pokazuje temat (Librus udostepnia tematy z ostatnich ~4 dni).
title: Librus
views:
  - title: Plan lekcji
    path: plan-lekcji
    icon: mdi:timetable
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # --- Podsumowanie: teraz, dziś i następny dzień ---
          - type: markdown
            content: |
              {%- set dzis = 'sensor.librus_imie_nazwisko_plan_lekcji_dzis' -%}
              {%- set nast = 'sensor.librus_imie_nazwisko_plan_lekcji_nastepny_dzien' -%}
              {%- set akt = 'sensor.librus_imie_nazwisko_aktualna_lekcja' -%}
              {%- macro opis(e) -%}
                {%- if states(e) in ['unknown', 'unavailable'] -%}
                brak danych
                {%- elif states(e) | int(0) == 0 -%}
                brak lekcji
                {%- else -%}
                **{{ states(e) }}** lekcji · {{ state_attr(e, 'pierwsza_lekcja_od') }}–{{ state_attr(e, 'ostatnia_lekcja_do') }}
                {%- endif -%}
              {%- endmacro -%}
              {%- if state_attr(akt, 'numer') is not none -%}
              🟢 **Teraz:** {{ states(akt) }} ({{ state_attr(akt, 'od') }}–{{ state_attr(akt, 'do') }}){% if state_attr(akt, 'nastepna_lekcja') %} · następna: **{{ state_attr(akt, 'nastepna_lekcja') }}** o {{ state_attr(akt, 'nastepna_od') }}{% endif %}
              {%- elif state_attr(akt, 'nastepna_lekcja') -%}
              ⏸️ **Przerwa** · następna: **{{ state_attr(akt, 'nastepna_lekcja') }}** o {{ state_attr(akt, 'nastepna_od') }}
              {%- else -%}
              ⚪ **Teraz:** brak lekcji
              {%- endif %}

              📍 **Dziś** ({{ state_attr(dzis, 'dzien_tygodnia') or '' }}): {{ opis(dzis) }}

              ➡️ **Następny dzień nauki**{% if state_attr(nast, 'data') %} ({{ state_attr(nast, 'dzien_tygodnia') }} {{ as_datetime(state_attr(nast, 'data')).strftime('%d.%m') }}){% endif %}: {{ opis(nast) }}

          # --- Plan tygodnia (z zaznaczoną trwającą lekcją) ---
          - type: markdown
            title: 🗓️ Plan lekcji
            content: |
              {%- set e = 'sensor.librus_imie_nazwisko_plan_lekcji_tydzien' -%}
              {%- set akt_nr = state_attr('sensor.librus_imie_nazwisko_aktualna_lekcja', 'numer') -%}
              {%- set akt_od = state_attr('sensor.librus_imie_nazwisko_aktualna_lekcja', 'od') -%}
              {%- set p = state_attr(e, 'przegladanie') or {} -%}
              {%- set plan = p.plan or {} -%}
              {%- set dzis = now().date() -%}
              {%- set skroty = ['Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob', 'Ndz'] -%}
              {%- set tematy = state_attr('sensor.librus_imie_nazwisko_tematy_lekcji', 'wg_dni') or {} -%}
              {%- if not plan -%}
              Brak danych planu lekcji na ten tydzień{% if p.od %} ({{ p.od[8:10] }}.{{ p.od[5:7] }}–{{ p.do[8:10] }}.{{ p.do[5:7] }}){% endif %}. Użyj przycisków poniżej, aby zmienić tydzień.
              {%- else -%}
              {%- set przes = p.przesuniecie | int(0) -%}
              _Tydzień {{ p.od[8:10] }}.{{ p.od[5:7] }}–{{ p.do[8:10] }}.{{ p.do[5:7] }} · {{ 'bieżący' if przes == 0 else 'za 1 tydzień' if przes == 1 else 'za ' ~ przes ~ ' tyg.' if przes > 0 else '1 tydzień temu' if przes == -1 else (przes | abs) ~ ' tyg. temu' }}{% if p.liczba_zmian %} · zmian: {{ p.liczba_zmian }}{% endif %}_
              {%- for d in plan.keys() | list | sort %}
              {%- set dt = as_datetime(d).date() %}
              {%- set roznica = (dt - dzis).days %}
              {%- set kolor = '⚪' if roznica < 0 else '🔴' if roznica == 0 else '🟠' if roznica == 1 else '🟡' if roznica <= 3 else '🟢' %}
              {%- set etykieta = 'Dziś' if roznica == 0 else 'Jutro' if roznica == 1 else 'Wczoraj' if roznica == -1 else 'Za ' ~ roznica ~ ' dni' if roznica > 1 else (roznica | abs) ~ ' dni temu' %}
              {%- set lekcje = plan[d] %}
              {%- set aktywne = lekcje | rejectattr('odwolana') | list %}

              ### {{ kolor }} {{ etykieta }} · {{ skroty[dt.weekday()] }} {{ dt.strftime('%d.%m') }}{% if aktywne %} · {{ aktywne | length }} {{ 'lekcja' if aktywne | length == 1 else 'lekcje' if aktywne | length in [2, 3, 4] else 'lekcji' }} · {{ aktywne[0].od }}–{{ aktywne[-1].do }}{% endif %}
              {%- if not lekcje %}
              - _Brak lekcji_
              {%- endif %}
              {%- for l in lekcje %}
              {%- set tm = namespace(t='') %}
              {%- if not l.odwolana %}
              {%- for x in tematy.get(d, []) %}
              {%- if not tm.t and (x.numer | string) == (l.numer | string) %}{% set tm.t = '<br>📖 <i>' ~ x.temat ~ '</i>' %}{% endif %}
              {%- endfor %}
              {%- endif %}
              {%- set trwa = (roznica == 0 and akt_nr is not none and (l.numer | string) == (akt_nr | string) and l.od == akt_od and not l.odwolana) %}
              {%- if l.odwolana %}
              - ❌ **{{ '➕' if l.dodatkowa is defined and l.dodatkowa else l.numer }}** · {{ l.od }}–{{ l.do }} · ~~{{ l.przedmiot }}~~ _({{ l.zmiana | lower }})_
              {%- elif l.dodatkowa is defined and l.dodatkowa %}
              - **{{ '🟢' if trwa else '➕' }}** · {{ l.od }}–{{ l.do }} · {{ l.przedmiot }}{% if l.nauczyciel_sala %} · {{ l.nauczyciel_sala }}{% endif %} _({{ 'trwa teraz' if trwa else 'zajęcia dodatkowe' }})_
              {%- elif l.zmiana %}
              - {{ '🟢' if trwa else '🔄' }} **{{ l.numer }}** · {{ l.od }}–{{ l.do }} · **{{ l.przedmiot_zastepczy if l.przedmiot_zastepczy is defined else l.przedmiot }}** — _{{ l.zmiana | lower }}{% if l.zastepca is defined %}: {{ l.zastepca }}{% endif %}{% if l.sala_zastepcza is defined %} · sala {{ l.sala_zastepcza }}{% endif %}_{{ tm.t }}
              {%- elif trwa %}
              - 🟢 **{{ l.numer }}** · {{ l.od }}–{{ l.do }} · **{{ l.przedmiot }}** _(trwa teraz)_{{ tm.t }}
              {%- else %}
              - **{{ l.numer }}** · {{ l.od }}–{{ l.do }} · {{ l.przedmiot }}{{ tm.t }}
              {%- endif %}
              {%- endfor %}
              {%- endfor %}

              <small>🟢 trwa teraz · ❌ odwołane · 🔄 zmiana / zastępstwo · ➕ zajęcia dodatkowe · 📖 temat lekcji</small>
              {%- endif -%}
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Poprzedni tydzień
                icon: mdi:chevron-left
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_plan
                  data:
                    kierunek: poprzedni
              - type: custom:mushroom-template-card
                primary: Bieżący
                icon: mdi:page-first
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_plan
                  data:
                    kierunek: biezacy
              - type: custom:mushroom-template-card
                primary: Następny tydzień
                icon: mdi:chevron-right
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_plan
                  data:
                    kierunek: nastepny

          # --- Odwolanie jednego terminu zajec dodatkowych (widoczne, gdy sa jakies zajecia dodatkowe) ---
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.librus_imie_nazwisko_lekcje_dodatkowe
                above: 0
            card:
              type: entities
              title: ➕ Zajęcia dodatkowe – odwołaj termin
              show_header_toggle: false
              state_color: false
              entities:
                - entity: select.librus_imie_nazwisko_lekcja_dodatkowa_termin
                  name: Termin
                - entity: button.librus_imie_nazwisko_lekcja_dodatkowa_odwolaj_termin
                  name: Odwołaj ten termin (tylko ten jeden dzień)
                  icon: mdi:calendar-remove
                - entity: button.librus_imie_nazwisko_lekcja_dodatkowa_przywroc_termin
                  name: Przywróć odwołany termin
                  icon: mdi:calendar-check

  # ===========================================================================
  # Zakladka 2: zajecia dodatkowe (dopisywane recznie do planu z Librusa)
  # ===========================================================================
  - title: Zajęcia dodatkowe
    path: zajecia-dodatkowe
    icon: mdi:calendar-plus
    cards:
      # --- Co jest zdefiniowane ---
      - type: markdown
        title: ➕ Zdefiniowane zajęcia
        content: |
          {%- set e = 'sensor.librus_imie_nazwisko_lekcje_dodatkowe' -%}
          {%- set lista = state_attr(e, 'lekcje') or [] -%}
          {%- if states(e) in ['unknown', 'unavailable'] -%}
          Brak danych.
          {%- elif not lista -%}
          _Nie dodano jeszcze żadnych zajęć. Wypełnij formularz i naciśnij **Dodaj do planu**._
          {%- else -%}
          {%- for l in lista %}
          - **{{ l.przedmiot }}** · {{ l.termin }}{% if l.miejsce %} · {{ l.miejsce }}{% endif %}{% if l.powtarzanie == 'jednorazowo' %} _(jednorazowo)_{% endif %}
          {%- endfor %}

          <small>Zajęcia trafiają do planu z Librusa (czujniki planu, kalendarz, koniec lekcji) i są oznaczone ➕.</small>
          {%- endif -%}

      # --- Formularz dodawania (jedna karta; dzien tygodnia albo data zaleznie od powtarzania) ---
      - type: entities
        title: Dodaj lub edytuj zajęcia
        show_header_toggle: false
        state_color: false
        entities:
          - entity: select.librus_imie_nazwisko_lekcja_dodatkowa_edycja
            name: Edytuj istniejące
          - type: divider
          - entity: text.librus_imie_nazwisko_lekcja_dodatkowa_nazwa
            name: Nazwa zajęć
          - entity: text.librus_imie_nazwisko_lekcja_dodatkowa_miejsce
            name: Miejsce / sala
          - type: divider
          - entity: select.librus_imie_nazwisko_lekcja_dodatkowa_powtarzanie
            name: Powtarzanie
          - type: conditional
            conditions:
              - condition: state
                entity: select.librus_imie_nazwisko_lekcja_dodatkowa_powtarzanie
                state: co tydzień
            row:
              entity: select.librus_imie_nazwisko_lekcja_dodatkowa_dzien
              name: Dzień tygodnia
          - type: conditional
            conditions:
              - condition: state
                entity: select.librus_imie_nazwisko_lekcja_dodatkowa_powtarzanie
                state: jednorazowo
            row:
              entity: date.librus_imie_nazwisko_lekcja_dodatkowa_data
              name: Data
          - entity: time.librus_imie_nazwisko_lekcja_dodatkowa_od
            name: Od godziny
          - entity: time.librus_imie_nazwisko_lekcja_dodatkowa_do
            name: Do godziny
          - type: divider
          # "Dodaj" gdy nic nie edytujesz, "Zapisz zmiany" gdy wybrano zajecia do edycji
          - type: conditional
            conditions:
              - condition: state
                entity: select.librus_imie_nazwisko_lekcja_dodatkowa_edycja
                state: "➕ nowe zajęcia"
            row:
              entity: button.librus_imie_nazwisko_lekcja_dodatkowa_dodaj
              name: Dodaj do planu
              icon: mdi:plus-circle
          - type: conditional
            conditions:
              - condition: state
                entity: select.librus_imie_nazwisko_lekcja_dodatkowa_edycja
                state_not: "➕ nowe zajęcia"
            row:
              entity: button.librus_imie_nazwisko_lekcja_dodatkowa_zapisz_zmiany
              name: Zapisz zmiany
              icon: mdi:content-save

      # --- Usuwanie (jedna karta) ---
      - type: entities
        title: Usuń zajęcia
        show_header_toggle: false
        state_color: false
        entities:
          - entity: select.librus_imie_nazwisko_lekcja_dodatkowa_do_usuniecia
            name: Wybierz zajęcia
          - entity: button.librus_imie_nazwisko_lekcja_dodatkowa_usun
            name: Usuń wybrane
            icon: mdi:delete
