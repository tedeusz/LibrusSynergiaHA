# Dashboard "Oceny" dla integracji Librus APIX (zastępuje stary widok z encjami i tabelką HTML).
# Dwie zakładki: "Oceny" i "Uwagi i zachowanie". Wklej: Ustawienia > Pulpity > (pulpit) > Edytuj > ⋮ > Edytor YAML -
# jako DWA elementy listy spod "views:" (albo tylko pierwszy, jeśli nie potrzebujesz uwag).
# Encje: sensor.librus_imie_nazwisko_oceny, ..._szczesliwy_numerek, ..._uwagi i ..._zachowanie (jeśli u Ciebie inne - zmień w szablonach).
# Plakietki: 🟢 5-6 · 🔵 4 · 🟡 3 · 🟠 2 · 🔴 1 · 💬 ocena opisowa. Trend: ↗ ostatnia ocena podniosła średnią, ↘ obniżyła, → bez zmian.
title: Librus oceny
views:
  - title: Oceny
    path: oceny
    icon: mdi:school
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # --- Podsumowanie ---
          - type: markdown
            content: |
              {%- set e = 'sensor.librus_imie_nazwisko_oceny' -%}
              {%- set pod = state_attr(e, 'podsumowanie') or {} -%}
              {%- set n = states('sensor.librus_imie_nazwisko_szczesliwy_numerek') -%}
              {%- if states(e) in ['unknown', 'unavailable'] -%}
              Brak danych o ocenach.
              {%- elif states(e) | int(0) == 0 -%}
              📭 **Brak ocen w semestrze {{ state_attr(e, 'semestr') or '' }}.**{% if n not in ['unknown', 'unavailable', 'None'] %} · 🍀 szczęśliwy numerek: **{{ n }}**{% endif %}
              {%- else -%}
              🎓 **Średnia ważona: {{ ("%.2f" | format(pod.srednia_wazona)) | replace('.', ',') if pod.srednia_wazona is not none else '—' }}** · ocen: **{{ states(e) }}** · przedmiotów: **{{ state_attr(e, 'liczba_przedmiotow') }}**{% if pod.liczba_nowych %} · 🆕 nowych: **{{ pod.liczba_nowych }}**{% endif %}{% if n not in ['unknown', 'unavailable', 'None'] %} · 🍀 numerek: **{{ n }}**{% endif %}
              {%- if pod.najlepszy %}

              🏆 **Najlepszy:** {{ pod.najlepszy }}{% if pod.najslabszy and pod.najslabszy != pod.najlepszy %} · ⚠️ **Najsłabszy:** {{ pod.najslabszy }}{% endif %}
              {%- endif %}
              {%- endif -%}

          # --- Zestawienie wg przedmiotów ---
          - type: markdown
            title: 📊 Oceny wg przedmiotów
            content: |
              {%- set przedmioty = state_attr('sensor.librus_imie_nazwisko_oceny', 'przedmioty') or [] -%}
              {%- if not przedmioty -%}
              Brak ocen do wyświetlenia.
              {%- else -%}
              | Przedmiot | Oceny | Średnia | |
              |:--|:--|:-:|:-:|
              {% for p in przedmioty -%}
              | {{ '🆕 ' if p.ma_nowe else '' }}**{{ p.przedmiot }}** | {% for o in p.oceny %}{{ o.ikona }}{{ o.ocena if o.ocena | length <= 3 else '' }}{{ '🆕' if o.nowa else '' }} {% endfor %}| {{ ("%.2f" | format(p.srednia)) | replace('.', ',') if p.srednia is not none else '—' }}{% if p.srednia_librus is not none and p.srednia is not none and (p.srednia_librus - p.srednia) | abs > 0.05 %} <small>(Librus {{ ("%.2f" | format(p.srednia_librus)) | replace('.', ',') }})</small>{% endif %} | {{ p.trend or '' }} |
              {% endfor %}
              {%- endif -%}

          # --- Ostatnie oceny (po 8 na ekran, przyciski poniżej) ---
          - type: markdown
            title: 🆕 Ostatnie oceny
            content: |
              {%- set p = state_attr('sensor.librus_imie_nazwisko_oceny', 'przegladanie') or {} -%}
              {%- set lista = p.oceny or [] -%}
              {%- set dzis = now().date() -%}
              {%- if not lista -%}
              Brak ocen do wyświetlenia.
              {%- else -%}
              _Oceny {{ p.od }}–{{ p.do }} z {{ p.razem }}{{ ' (najnowsze)' if p.najnowsze else '' }}_
              {%- for o in lista %}
              {%- set roznica = (dzis - as_datetime(o.data_iso).date()).days if o.data_iso else none %}
              {%- set kiedy = ('dziś' if roznica == 0 else 'wczoraj' if roznica == 1 else roznica ~ ' dni temu') if roznica is not none and 0 <= roznica < 14 else '' %}
              {%- set dm = (o.data_iso[8:10] ~ '.' ~ o.data_iso[5:7] ~ '.' ~ o.data_iso[0:4]) if o.data_iso else o.data %}
              - {{ o.ikona }} **{{ o.ocena if o.ocena | length <= 8 else 'opisowa' }}** · {{ o.przedmiot }}{% if o.kategoria %} · {{ o.kategoria }}{% endif %}{% if o.waga and not o.opisowa %} · waga {{ o.waga }}{% endif %} · _{{ dm }}{{ ' (' ~ kiedy ~ ')' if kiedy else '' }}_{{ ' 🆕' if o.jest_nowa else '' }}{{ ' · nie liczy się' if o.liczy_sie == false else '' }}{% if o.komentarz %}<br>💬 {{ o.komentarz | replace('\r', ' ') | replace('\n', ' ') | truncate(200) }}{% endif %}
              {%- endfor %}
              {%- endif -%}
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Starsze
                icon: mdi:chevron-left
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_oceny
                  data:
                    kierunek: nastepna
              - type: custom:mushroom-template-card
                primary: Najnowsze
                icon: mdi:page-first
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_oceny
                  data:
                    kierunek: najnowsze
              - type: custom:mushroom-template-card
                primary: Nowsze
                icon: mdi:chevron-right
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_oceny
                  data:
                    kierunek: poprzednia

  - title: Uwagi i zachowanie
    path: uwagi
    icon: mdi:clipboard-alert-outline
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # --- Ocena zachowania ---
          - type: markdown
            title: 🎭 Zachowanie
            content: |
              {%- set z = 'sensor.librus_imie_nazwisko_zachowanie' -%}
              {%- set okresy = {'okres_1': 'semestr 1', 'okres_2': 'semestr 2', 'roczna': 'roczna'} -%}
              {%- if states(z) in ['unknown', 'unavailable'] -%}
              Brak danych o zachowaniu.
              {%- elif states(z) == 'brak' -%}
              Ocena zachowania nie została jeszcze wystawiona.{% if state_attr(z, 'liczba_pozytywnych') or state_attr(z, 'liczba_negatywnych') %} · 🌟 pozytywne: **{{ state_attr(z, 'liczba_pozytywnych') }}** · ⚠️ negatywne: **{{ state_attr(z, 'liczba_negatywnych') }}**{% endif %}
              {%- else -%}
              ## {{ states(z) | capitalize }} <small>{{ okresy.get(state_attr(z, 'ocena_biezaca_okres'), '') }}{{ ' · propozycja' if state_attr(z, 'ocena_jest_propozycja') else '' }}</small>

              | | |
              |:--|:--|
              | Semestr 1 | **{{ (state_attr(z, 'okres_1') or {}).ocena or '—' }}**{{ ' <small>(propozycja)</small>' if (state_attr(z, 'okres_1') or {}).propozycja else '' }} |
              | Semestr 2 | **{{ (state_attr(z, 'okres_2') or {}).ocena or '—' }}**{{ ' <small>(propozycja)</small>' if (state_attr(z, 'okres_2') or {}).propozycja else '' }} |
              | Roczna | **{{ (state_attr(z, 'roczna') or {}).ocena or '—' }}**{{ ' <small>(propozycja)</small>' if (state_attr(z, 'roczna') or {}).propozycja else '' }} |

              🌟 pozytywne wpisy: **{{ state_attr(z, 'liczba_pozytywnych') }}** · ⚠️ negatywne: **{{ state_attr(z, 'liczba_negatywnych') }}**
              {%- endif -%}

          # --- Wpisy o zachowaniu (ostatnie 8) ---
          - type: markdown
            title: 📋 Wpisy o zachowaniu
            content: |
              {%- set wpisy = state_attr('sensor.librus_imie_nazwisko_zachowanie', 'wpisy') or [] -%}
              {%- set ikony = {'pozytywne': '🟢', 'negatywne': '🔴', 'neutralne': '⚪'} -%}
              {%- if not wpisy -%}
              Brak wpisów o zachowaniu. 🎉
              {%- else -%}
              {%- for w in wpisy[:8] %}
              - {{ ikony.get(w.rodzaj, '⚪') }} **{{ w.ocena }}** · {{ w.data }}{% if w.nauczyciel %} · {{ w.nauczyciel }}{% endif %}{{ ' 🆕' if w.jest_nowy else '' }}{% if w.komentarz %}<br>💬 {{ w.komentarz | replace('\r', ' ') | replace('\n', ' ') | truncate(200) }}{% endif %}
              {%- endfor %}
              {%- if wpisy | length > 8 %}

              _…i {{ wpisy | length - 8 }} starszych_
              {%- endif %}
              {%- endif -%}

          # --- Uwagi i pochwały (po 5 na ekran, przyciski poniżej) ---
          - type: markdown
            title: 📝 Uwagi i pochwały
            content: |
              {%- set u = 'sensor.librus_imie_nazwisko_uwagi' -%}
              {%- set p = state_attr(u, 'przegladanie') or {} -%}
              {%- set lista = p.uwagi or [] -%}
              {%- set ikony = {'pozytywna': '🌟', 'negatywna': '⚠️', 'neutralna': '📝'} -%}
              {%- if states(u) in ['unknown', 'unavailable'] -%}
              Brak danych o uwagach.
              {%- elif state_attr(u, 'dostepne') == false -%}
              Moduł uwag nie jest dostępny dla tego konta w Librusie.
              {%- else -%}
              {%- if state_attr(u, 'nierozpoznany_uklad') %}
              ⚠️ _Strona uwag w Librusie ma nieznany układ - lista może być nieaktualna (usługa `librus_apix.diagnostyka_ocen` zapisze jej HTML do analizy)._

              {% endif -%}
              {%- if not lista -%}
              Brak uwag. 🎉
              {%- else -%}
              ⚠️ negatywne: **{{ state_attr(u, 'liczba_negatywnych') }}** · 🌟 pozytywne: **{{ state_attr(u, 'liczba_pozytywnych') }}**{% if state_attr(u, 'liczba_neutralnych') %} · 📝 inne: **{{ state_attr(u, 'liczba_neutralnych') }}**{% endif %}

              _Wpisy {{ p.od }}–{{ p.do }} z {{ p.razem }}{{ ' (najnowsze)' if p.najnowsze else '' }}_
              {%- for w in lista %}
              - {{ ikony.get(w.znak, '📝') }} **{{ w.kategoria or w.rodzaj or 'Uwaga' }}** · {{ w.data }}{% if w.nauczyciel %} · {{ w.nauczyciel }}{% endif %}{{ ' 🆕' if w.jest_nowa else '' }}{% if w.tresc %}<br>{{ w.tresc | replace('\r', ' ') | replace('\n', ' ') | truncate(300) }}{% endif %}
              {%- endfor %}
              {%- endif -%}
              {%- endif -%}
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Starsze
                icon: mdi:chevron-left
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_uwagi
                  data:
                    kierunek: nastepna
              - type: custom:mushroom-template-card
                primary: Najnowsze
                icon: mdi:page-first
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_uwagi
                  data:
                    kierunek: najnowsze
              - type: custom:mushroom-template-card
                primary: Nowsze
                icon: mdi:chevron-right
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: librus_apix.przegladaj_uwagi
                  data:
                    kierunek: poprzednia
